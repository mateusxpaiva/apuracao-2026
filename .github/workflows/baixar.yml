name: Baixar fontes (mundo)

on:
  workflow_dispatch:
    inputs:
      lista:
        description: "Arquivo com as fontes (nome url por linha)"
        default: "pipeline/fontes.txt"
      tempo:
        description: "Tempo máximo por arquivo (segundos)"
        default: "240"

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Preparar ramo raw
        run: |
          git clone --branch raw --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" raw 2>/dev/null || {
            mkdir raw && cd raw && git init -q && git checkout -q -b raw &&
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - name: Baixar
        run: |
          cd raw
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          : > log.txt
          grep -v '^\s*#' "../main/${{ inputs.lista }}" | while read -r nome url corpo; do
            [ -z "$nome" ] && continue
            mkdir -p "$(dirname "$nome")"
            # terceira coluna opcional: corpo JSON -> POST (APIs PxWeb de estatística oficial)
            if [ -n "$corpo" ]; then extra=(-X POST -H "Content-Type: application/json" --data "$corpo"); else extra=(); fi
            code=$(curl -sS -L --retry 1 --connect-timeout 20 --max-time ${{ inputs.tempo || 240 }} -A "$UA" "${extra[@]}" -o "$nome" -w '%{http_code} %{content_type} %{size_download}' "$url" || echo "ERRO")
            echo "$nome $code $url" | tee -a log.txt
            if [ -f "$nome" ]; then
              case "$nome" in *.zip)
                unzip -l "$nome" > "$nome.lista.txt" 2>&1 || true
                unzip -Z1 "$nome" 2>/dev/null | while read -r m; do echo "=== $m"; unzip -p "$nome" "$m" 2>/dev/null | head -c 3000 | head -n 6; echo; done > "$nome.amostra.txt" || true ;;
              esac
              sz=$(stat -c %s "$nome")
              if [ "$sz" -gt 40000000 ]; then rm -f "$nome"; echo "$nome grande ($sz bytes): guardada so a amostra" | tee -a log.txt; fi
            fi
          done
          du -sh . ; ls -la
      - name: Gravar no ramo raw
        run: |
          cd raw
          git config user.name "apuracao-por-ia-bot"
          git config user.email "apuracao-por-ia-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Fontes brutas: ${{ inputs.lista }}" || echo "sem mudanças"
          git push -q origin raw
