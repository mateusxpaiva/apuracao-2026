<script>
	$(document).ready(function() {
		function adjust404() {
			var path_n_file = '/templates/styles/pm_404.css';
			var $head = $( 'head' );
			var $headlinklast = $head.find( 'link[rel="stylesheet"]:last' );
			var linkElement = '<link rel="stylesheet" href="' + path_n_file + '?v=' + Math.floor(Date.now() / 1000) + '">';

			if ($headlinklast.length){
				$headlinklast.after(linkElement);
			}
			else {
				$head.append(linkElement);
			}

			$( '#maincontent > p:first-of-type' ).addClass( 'logoHolder' );

			$( '.logoHolder' ).append( '<span class="mag"></span>' );

			$( '<div id="h1404" />' ).insertAfter( '.logoHolder' );

			$( '#col_left2, #col_right2' ).remove();

			$( 'html' ).attr( 'id', 'nu404Ev' );
		}
		adjust404();
	}); // Nigh
